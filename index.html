<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>滑动变祖器网页版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #ffffff;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 460px;
  }
  .header {
    text-align: center;
    margin-bottom: 22px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .rating {
    margin-top: 6px;
    font-size: 14px;
    color: #666;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .rating .star { color: #f5a623; }
  .card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: #f5f5f5;
  }
  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.12s linear;
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }
  .title-row {
    position: relative;
    height: 44px;
    margin: 18px 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .title {
    position: absolute;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 4px;
    opacity: 0;
    transition: opacity 0.12s linear;
    white-space: nowrap;
  }
  .slider-wrap {
    margin-top: 6px;
    padding: 10px 4px 0;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: #e8e8e8;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #111;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    cursor: grab;
    transition: transform 0.1s ease;
  }
  input[type=range]::-webkit-slider-thumb:active {
    cursor: grabbing;
    transform: scale(1.15);
  }
  input[type=range]::-moz-range-thumb {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #111;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    cursor: grab;
  }
  .ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 12px;
    color: #999;
  }
  .footer {
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: #888;
    letter-spacing: 0.5px;
  }
</style>

      <div class="title-row">
        <span class="title left"  id="tLeft"  style="opacity:1;">彭嵩涵</span>
        <span class="title mid"   id="tMid"   >彭子</span>
        <span class="title right" id="tRight" >彭圣</span>
      </div>

      <div class="slider-wrap">
        <input type="range" id="slider" min="0" max="1000" value="0" step="1">

          <span>彭嵩涵</span><span>彭子</span><span>彭圣</span>
        </div>
      </div>
    </main>

    <footer class="footer">拖动滑块，改变形象与称号。</footer>
  </div>

<script>
(function() {
  const slider  = document.getElementById('slider');
  const imgL    = document.getElementById('imgLeft');
  const imgM    = document.getElementById('imgMid');
  const imgR    = document.getElementById('imgRight');
  const tL      = document.getElementById('tLeft');
  const tM      = document.getElementById('tMid');
  const tR      = document.getElementById('tRight');
  const starRow = document.getElementById('starRow');
  const scoreTx = document.getElementById('scoreText');

  function apply(pos) {
    let oL = 1 - pos * 2;
    let oM = pos < 0.5 ? pos * 2 : 2 - pos * 2;
    let oR = pos * 2 - 1;

    oL = Math.max(0, Math.min(1, oL));
    oM = Math.max(0, Math.min(1, oM));
    oR = Math.max(0, Math.min(1, oR));

    imgL.style.opacity = oL;
    imgM.style.opacity = oM;
    imgR.style.opacity = oR;

    let tLo = pos < 0.33 ? 1 - pos / 0.33 : 0;
    let tRo = pos > 0.66 ? (pos - 0.66) / 0.34 : 0;
    let tMo = 1 - tLo - tRo;
    tLo = Math.max(0, tLo);
    tMo = Math.max(0, Math.min(1, tMo));
    tRo = Math.max(0, Math.min(1, tRo));

    tL.style.opacity = tLo;
    tM.style.opacity = tMo;
    tR.style.opacity = tRo;

    // 评分随滑块从左到右由低到高：1.0 → 5.0
    const score = 1 + pos * 4;
    scoreTx.textContent = score.toFixed(1);
    const full = Math.round(score);
    starRow.textContent = '★'.repeat(full) + '☆'.repeat(5 - full);
  }

  slider.addEventListener('input', function() {
    apply(parseInt(slider.value, 10) / 1000);
  });
  apply(0);
})();
</script>
